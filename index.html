<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Дикие звери изучают китайский</title>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --card: #ffffff;
      --text: #2d3436;
      --soft: #636e72;
      --shadow: 0 12px 30px rgba(0,0,0,0.12);
      --radius: 28px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: 'Nunito', system-ui, sans-serif;
      background: linear-gradient(160deg, #fff7e6 0%, #e8f8f5 50%, #fce4ec 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      color: var(--text);
    }
    .app { width: 100%; max-width: 480px; }
    .screen { display: none; animation: fadeIn 0.4s ease; }
    .screen.active { display: block; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .start-card, .question-card, .end-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 28px 20px;
      text-align: center;
      box-shadow: var(--shadow);
    }
    h1 {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.6rem;
      color: #e67e22;
      margin-bottom: 10px;
    }
    .subtitle { color: var(--soft); margin-bottom: 20px; font-size: 1.05rem; }
    .animals-row { font-size: 2.4rem; margin-bottom: 6px; }
    .big-btn {
      background: linear-gradient(180deg, #ffb347, #ff9f43);
      color: white;
      font-family: 'Fredoka', sans-serif;
      font-size: 1.25rem;
      font-weight: 600;
      padding: 16px 36px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 7px 0 #e67e22;
      margin-top: 18px;
    }
    .big-btn:active { transform: translateY(5px); box-shadow: 0 2px 0 #e67e22; }
    .game-header {
      display: flex;
      justify-content: space-between;
      background: white;
      border-radius: 50px;
      padding: 12px 20px;
      margin-bottom: 14px;
      box-shadow: 0 6px 16px rgba(0,0,0,0.08);
    }
    .score { font-weight: 800; font-size: 1.2rem; color: #f39c12; }
    .round { font-weight: 700; color: #0984e3; }
    .animal-pic {
      width: 180px; height: 180px;
      margin: 0 auto 12px;
      border-radius: 24px;
      background: #fff9e6;
      border: 5px solid #ffeaa7;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .animal-pic img { width: 100%; height: 100%; object-fit: cover; }
    .animal-pic .emoji-fallback { font-size: 5.5rem; }
    .question-text { font-size: 1.1rem; font-weight: 700; color: var(--soft); margin-bottom: 14px; }

    .correct-word {
      display: none;
      margin: 10px 0 16px;
      padding: 14px;
      background: #e8f8f5;
      border-radius: 18px;
      border: 3px solid #2ecc71;
    }
    .correct-word.show { display: block; }
    .correct-word .zh-big { font-size: 2.8rem; font-weight: 800; color: #2d3436; line-height: 1.1; }
    .correct-word .py-big { font-size: 1.3rem; color: #0984e3; font-weight: 700; margin-top: 2px; }
    .correct-word .ru-name { font-size: 1.15rem; color: #636e72; margin-top: 4px; font-weight: 700; }

    .speak-btn {
      background: linear-gradient(180deg, #74b9ff, #0984e3);
      color: white;
      font-family: 'Fredoka', sans-serif;
      font-size: 1.1rem;
      font-weight: 600;
      padding: 12px 26px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 5px 0 #0652dd;
      margin-bottom: 16px;
    }
    .speak-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #0652dd; }
    .speak-btn.hidden { display: none; }
    .answers { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .answer-btn {
      background: #f8f9fa;
      border: 3px solid #e9ecef;
      border-radius: 18px;
      padding: 14px 8px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 74px;
      justify-content: center;
    }
    .answer-btn .zh { font-size: 1.55rem; font-weight: 800; }
    .answer-btn .py { font-size: 0.9rem; color: #74b9ff; font-weight: 700; }
    .answer-btn.correct { background: #d4edda; border-color: #2ecc71; }
    .answer-btn.wrong { background: #f8d7da; border-color: #ff6b6b; animation: shake 0.4s; }
    .answer-btn.disabled { pointer-events: none; opacity: 0.75; }
    @keyframes shake {
      0%,100%{transform:translateX(0)} 20%{transform:translateX(-6px)} 40%{transform:translateX(6px)}
      60%{transform:translateX(-4px)} 80%{transform:translateX(4px)}
    }
    .feedback { margin-top: 12px; min-height: 36px; font-size: 1.15rem; font-weight: 800; }
    .feedback.good { color: #27ae60; }
    .feedback.bad { color: #e74c3c; }
    .next-btn {
      background: linear-gradient(180deg, #54a0ff, #2e86de);
      color: white;
      font-family: 'Fredoka', sans-serif;
      font-size: 1.1rem;
      font-weight: 600;
      padding: 13px 32px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 5px 0 #1e6bb8;
      display: none;
      margin-top: 8px;
    }
    .next-btn.show { display: inline-block; }
    .next-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #1e6bb8; }
    .end-card h2 { font-family: 'Fredoka', sans-serif; font-size: 1.8rem; color: #e67e22; }
    .stars { font-size: 2.5rem; margin: 12px 0; }
    .score-text { font-size: 1.2rem; font-weight: 800; color: #0984e3; margin-bottom: 6px; }
    .msg { color: var(--soft); margin-bottom: 20px; }
  </style>
</head>
<body>
  <div class="app">
    <div id="startScreen" class="screen active">
      <div class="start-card">
        <h1>Дикие звери<br>изучают китайский</h1>
        <p class="subtitle">Давай выучим названия животных<br>на китайском языке!</p>
        <div class="animals-row">🐺 🦊 🦔 🐻 🦌</div>
        <div class="animals-row" style="font-size:2.2rem">🐯 🐆 🫎 🦡 🐈</div>
        <button class="big-btn" id="startBtn">开始 / Начать</button>
      </div>
    </div>

    <div id="gameScreen" class="screen">
      <div class="game-header">
        <div class="score">⭐ <span id="scoreVal">0</span></div>
        <div class="round">Раунд <span id="roundVal">1</span> / 10</div>
      </div>
      <div class="question-card">
        <div class="animal-pic" id="animalPic"><span class="emoji-fallback">🐺</span></div>
        <p class="question-text">Кто это? Выбери правильное<br>китайское слово:</p>

        <div class="correct-word" id="correctWord">
          <div class="zh-big" id="zhBig">狼</div>
          <div class="py-big" id="pyBig">láng</div>
          <div class="ru-name" id="ruName">Волк</div>
        </div>

        <button class="speak-btn hidden" id="speakBtn">🔊 Послушать слово</button>
        <div class="answers" id="answers"></div>
        <div class="feedback" id="feedback"></div>
        <button class="next-btn" id="nextBtn">Дальше →</button>
      </div>
    </div>

    <div id="endScreen" class="screen">
      <div class="end-card">
        <h2>Молодец! 🎉</h2>
        <div class="stars" id="endStars">⭐⭐⭐</div>
        <p class="score-text">Ты набрал <span id="finalScore">0</span> звёзд!</p>
        <p class="msg">Панда и Тигр гордятся тобой!<br>Ты уже знаешь названия диких зверей на китайском 🌟</p>
        <button class="big-btn" id="againBtn">Играть снова</button>
      </div>
    </div>
  </div>

    };

    let score = 0, currentIndex = 0, order = [], answered = false, currentAnimal = null, currentAudio = null;

    const startBtn    = document.getElementById('startBtn');
    const againBtn    = document.getElementById('againBtn');
    const nextBtn     = document.getElementById('nextBtn');
    const speakBtn    = document.getElementById('speakBtn');
    const scoreVal    = document.getElementById('scoreVal');
    const roundVal    = document.getElementById('roundVal');
    const animalPic   = document.getElementById('animalPic');
    const answersEl   = document.getElementById('answers');
    const feedback    = document.getElementById('feedback');
    const finalScore  = document.getElementById('finalScore');
    const endStars    = document.getElementById('endStars');
    const correctWord = document.getElementById('correctWord');
    const zhBig       = document.getElementById('zhBig');
    const pyBig       = document.getElementById('pyBig');
    const ruName      = document.getElementById('ruName');

    function speakChinese(text) {
      if (currentAudio) { currentAudio.pause(); currentAudio = null; }
      speakBtn.textContent = '🔊 Говорит...';
      speakBtn.style.opacity = '0.75';
      const url = 'https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=zh-CN&q=' + encodeURIComponent(text);
      currentAudio = new Audio(url);
      currentAudio.volume = 1;
      currentAudio.onended = function() {
        speakBtn.textContent = '🔊 Послушать слово';
        speakBtn.style.opacity = '1';
        currentAudio = null;
      };
      currentAudio.onerror = function() {
        speakBtn.textContent = '🔊 Послушать слово';
        speakBtn.style.opacity = '1';
        if (window.speechSynthesis) {
          const u = new SpeechSynthesisUtterance(text);
          u.lang = 'zh-CN'; u.rate = 0.85;
          speechSynthesis.speak(u);
        }
      };
      currentAudio.play().catch(function() {
        speakBtn.textContent = '🔊 Послушать слово';
        speakBtn.style.opacity = '1';
      });
    }

    function shuffle(a) {
      const arr = a.slice();
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const t = arr[i]; arr[i] = arr[j]; arr[j] = t;
      }
      return arr;
    }

    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    function startGame() {
      score = 0; currentIndex = 0;
      order = shuffle(ANIMALS);
      scoreVal.textContent = '0';
      showScreen('gameScreen');
      loadQuestion();
    }

    function loadQuestion() {
      answered = false;
      feedback.textContent = '';
      feedback.className = 'feedback';
      nextBtn.classList.remove('show');
      speakBtn.classList.add('hidden');
      correctWord.classList.remove('show');

      currentAnimal = order[currentIndex];
      roundVal.textContent = currentIndex + 1;

      animalPic.innerHTML = '';
      if (IMAGES[currentAnimal.id]) {
        const img = document.createElement('img');
        img.src = IMAGES[currentAnimal.id];
        img.alt = currentAnimal.ru;
        img.onerror = function() {
          animalPic.innerHTML = '<span class="emoji-fallback">' + currentAnimal.emoji + '</span>';
        };
        animalPic.appendChild(img);
      } else {
        animalPic.innerHTML = '<span class="emoji-fallback">' + currentAnimal.emoji + '</span>';
      }

      const others = ANIMALS.filter(a => a.id !== currentAnimal.id);
      const options = shuffle([currentAnimal].concat(shuffle(others).slice(0, 3)));

      answersEl.innerHTML = '';
      options.forEach(function(opt) {
        const btn = document.createElement('button');
        btn.className = 'answer-btn';
        btn.dataset.id = opt.id;
        const zhSpan = document.createElement('span');
        zhSpan.className = 'zh';
        zhSpan.textContent = opt.zh;
        const pySpan = document.createElement('span');
        pySpan.className = 'py';
        pySpan.textContent = opt.pinyin;
        btn.appendChild(zhSpan);
        btn.appendChild(pySpan);
        btn.onclick = function() { handleAnswer(btn, opt); };
        answersEl.appendChild(btn);
      });
    }

    function handleAnswer(btn, selected) {
      if (answered) return;
      answered = true;
      document.querySelectorAll('.answer-btn').forEach(b => b.classList.add('disabled'));

      zhBig.textContent = currentAnimal.zh;
      pyBig.textContent = currentAnimal.pinyin;
      ruName.textContent = currentAnimal.ru;
      correctWord.classList.add('show');
      speakBtn.classList.remove('hidden');

      if (selected.id === currentAnimal.id) {
        btn.classList.add('correct');
        score += 10;
        scoreVal.textContent = score;
        feedback.textContent = 'Правильно! 🎉';
        feedback.className = 'feedback good';
        setTimeout(function() { speakChinese(currentAnimal.zh); }, 250);
      } else {
        btn.classList.add('wrong');
        document.querySelectorAll('.answer-btn').forEach(b => {
          if (b.dataset.id === currentAnimal.id) b.classList.add('correct');
        });
        feedback.textContent = 'Почти! Смотри правильный ответ выше 👆';
        feedback.className = 'feedback bad';
        setTimeout(function() { speakChinese(currentAnimal.zh); }, 350);
      }
      nextBtn.classList.add('show');
    }

    function nextQuestion() {
      currentIndex++;
      if (currentIndex >= 10) {
        finalScore.textContent = score;
        endStars.textContent = score >= 70 ? '⭐⭐⭐' : score >= 40 ? '⭐⭐' : '⭐';
        showScreen('endScreen');
      } else {
        loadQuestion();
      }
    }

    startBtn.onclick = startGame;
    againBtn.onclick = startGame;
    nextBtn.onclick = nextQuestion;
    speakBtn.onclick = function() {
      if (currentAnimal) speakChinese(currentAnimal.zh);
    };
  </script>
</body>
</html>
